client_id = "SHOPIFY_API_KEY"
name = "AdTrace Enterprise"
handle = "adtrace-enterprise"
application_url = "https://fb-pixel-capi.pthapp.co.in"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_customers,read_markets,write_pixels,read_customer_events"

[auth]
redirect_urls = [
  "https://fb-pixel-capi.pthapp.co.in/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled", "shop/update", "app/scopes_update", "app_subscriptions/update" ]
uri = "/webhooks/shopify"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks/shopify"

[app_proxy]
url = "https://fb-pixel-capi.pthapp.co.in/apps/adtrace"
subpath = "adtrace"
prefix = "apps"
